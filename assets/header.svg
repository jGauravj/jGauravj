<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none" role="img" aria-label="Gaurav Jangir, Full Stack Developer">
  <title>Gaurav Jangir, Full Stack Developer</title>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1010 160) scale(300)">
      <stop stop-color="#E5484D" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#E5484D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="56" y1="0" x2="560" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#9BA3AF"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E5484D" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#E5484D" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#E5484D" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card">
      <rect width="1200" height="320" rx="20"/>
    </clipPath>
  </defs>

  <style>
    .sans { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-out infinite; }
    .spin { transform-origin: 1010px 160px; animation: spin 36s linear infinite; }
    @keyframes pulse { from { opacity: 0.7; transform: scale(1); } to { opacity: 0; transform: scale(3); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="#0B0D12"/>
    <rect width="1200" height="320" fill="url(#dots)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>

    <!-- orbit -->
    <circle cx="1010" cy="160" r="128" stroke="#FFFFFF" stroke-opacity="0.05"/>
    <circle cx="1010" cy="160" r="88" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <circle cx="1010" cy="160" r="48" stroke="#E5484D" stroke-opacity="0.35"/>
    <circle cx="1010" cy="160" r="9" fill="#E5484D" fill-opacity="0.85"/>
    <g class="spin">
      <circle cx="1010" cy="72" r="6" fill="#E5484D"/>
      <circle cx="1086.2" cy="204" r="6" fill="#E5484D"/>
      <circle cx="933.8" cy="204" r="6" fill="#E5484D"/>
    </g>

    <rect y="318" width="1200" height="2" fill="url(#edge)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="19.5" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- status pill -->
  <g>
    <rect x="56" y="46" width="178" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <circle class="pulse" cx="78" cy="63" r="5" fill="#3FB950"/>
    <circle cx="78" cy="63" r="5" fill="#3FB950"/>
    <text x="92" y="68.5" class="sans" font-size="15" fill="#C9D1D9">Available for work</text>
  </g>

  <text x="52" y="160" class="sans" font-size="68" font-weight="700" letter-spacing="-1.5" fill="url(#name)">Gaurav Jangir</text>
  <text x="56" y="206" class="sans" font-size="24" fill="#9BA3AF">Full Stack Developer <tspan fill="#E5484D">/</tspan> React · Next.js · Node.js</text>
  <text x="56" y="264" class="mono" font-size="17" fill="#7D8590">~/jaipur, india  ·  1.5+ yrs experience  ·  building AI-powered web apps</text>
</svg>
